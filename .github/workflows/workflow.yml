name: GitHub Actions Demo

on: 
  push:
    branches:
      - dev

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.dir }}
    steps:
      - id: login-ecr
        if: true
        run: |
          echo "registry=353242502308.dkr.ecr.ap-northeast-1.amazonaws.com" >> $GITHUB_OUTPUT
        
      - env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "${{ env.ECR_REGISTRY }}"

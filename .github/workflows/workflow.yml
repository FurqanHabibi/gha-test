name: GitHub Actions Demo

on: 
  push:
    branches:
      - dev

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - a: a
            b: b
          - a: a
    steps:
      - run: echo "${{ matrix.a }}"
      - if: matrix.b != ''
        run: echo "${{ matrix.b }}"
